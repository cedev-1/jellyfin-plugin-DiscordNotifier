changelog: |
  - New: 21 additional notifiers (27 total) — media, playback, sessions, server, plugins, user data
  - New: webhook branding — custom bot display name and avatar URL
  - New: collapsible notification preview with Discord-styled embeds for all events
  - New: plugin added to admin dashboard navbar
  - New: centralized webhook serialization with automatic branding injection
  - Fix: Discord "username cannot contain discord" guard with frontend warning
  - Fix: episode grouping with stable keys, Series/MusicAlbum not filtered as Folder
  - Security: admin-only test endpoint, webhook URL excluded from logs, markdown injection prevention
  - Privacy: GDPR toggle to hide IP addresses from login/session notifications
  - Improvement: anti-spam debouncing, burst caps, scan-aware suppression, rate-limit retry
  - UI: config page reorganized with section separators and collapsible advanced options
