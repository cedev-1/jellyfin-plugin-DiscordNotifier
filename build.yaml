changelog: |
  - Security: admin-only test endpoint, webhook URL not logged, markdown injection prevention
  - Fix: 4 notifiers converted to IHostedService (TaskCompleted, PendingRestart, SubtitleFailure, LyricFailure)
  - Fix: Episode grouping with stable keys, Series/MusicAlbum not filtered as Folder
  - Feature: IP address privacy toggle (GDPR), rate-limit retry, anti-spam debouncing
  - Polish: consistent Discord embed formatting, burst caps, scan-aware suppression
