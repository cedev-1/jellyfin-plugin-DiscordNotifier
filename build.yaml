overview: "Sends configurable Discord webhook notifications for media, user, playback, and server events."
description: >
  A Jellyfin plugin that sends Discord webhook notifications for library changes
  (new content, deletions, metadata updates), playback events (start, stop, progress),
  user management (creation, deletion, login, lockout), server lifecycle (start,
  restart required, task completion), and plugin management.
category: "Notifications"
artifacts:
